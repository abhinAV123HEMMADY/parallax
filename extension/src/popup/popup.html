<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parallax</title>
    <style>
      /* Light only, matching the injected panel. color-scheme: light stops Chrome from
         darkening form controls for a user on a dark OS, which would otherwise leave grey
         controls sitting on a white page. */
      :root {
        color-scheme: light;

        --bg: #ffffff;
        --surface: #f6f5fb;
        --fg: #23222b;
        --fg-dim: #62606f;
        --fg-faint: #706d7b;
        --line: #ebe9f3;
        --line-strong: #ddd9ec;
        --accent: #6354d6;
        --accent-tint: #efecfd;
        --danger: #b3455e;
        --danger-tint: #fdeef2;
      }

      * { box-sizing: border-box; }

      body {
        /* overflow-x: .note's negative inline margin (for the full-width hover tint) makes rows
           wider than the body box, which would otherwise raise a scrollbar in a 328px popup. */
        width: 328px; margin: 0; padding: 16px; overflow-x: hidden;
        background: var(--bg); color: var(--fg);
        font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      h1 {
        font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
        color: var(--fg-faint); margin: 0;
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .muted { color: var(--fg-dim); font-size: 12px; }

      #status { margin: 12px 0; }
      #status.error {
        color: var(--danger); background: var(--danger-tint);
        padding: 8px 10px; border-radius: 8px;
      }

      /* Space and a hover tint instead of rules — same treatment as the panel's note list. */
      .note {
        padding: 9px 10px; margin: 0 -10px;
        border-radius: 10px;
        transition: background-color 150ms ease;
      }
      .note:hover { background: var(--surface); }

      .ts {
        color: var(--accent); background: var(--accent-tint);
        font-weight: 600; font-size: 11.5px; font-variant-numeric: tabular-nums;
        padding: 1px 7px; border-radius: 6px; text-decoration: none;
      }
      a { color: var(--accent); }

      button {
        font: inherit; font-size: 12px; font-weight: 550; cursor: pointer;
        padding: 6px 12px; border-radius: 9px;
        border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg);
        transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
      }
      button:hover { background: var(--surface); border-color: var(--accent); }
      button:active { transform: scale(.98); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .error { color: var(--danger); }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        button:active { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="row">
      <h1>Parallax</h1>
      <button id="options">Settings</button>
    </div>
    <p class="muted" id="status">Loading…</p>
    <div id="notes"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete; cancel it rather than pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      # pgvector, not plain postgres: the schema declares Vector(384) columns and init_db.py
      # runs CREATE EXTENSION vector, so the stock image fails at schema creation.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: parallax
          POSTGRES_PASSWORD: parallax
          POSTGRES_DB: parallax
        # 5433 on the host to match the default in app/config.py, so no DATABASE_URL override
        # is needed here and CI exercises the same connection settings as a dev machine.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U parallax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite asserts that embeddings are semantically ordered (tests/test_embedding.py),
      # which is exactly what the hash placeholder fails. Forcing bge here keeps CI honest —
      # PARALLAX_EMBED=hash would turn those assertions green by removing what they measure.
      PARALLAX_EMBED: bge
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Key the weight cache on the model's identity, not on the file that happens to name it.
      # Hashing the source meant any edit to it — a docstring tweak, the parallax rename —
      # discarded ~61MB of still-correct weights and re-downloaded them. Guarded with an
      # explicit failure because the quiet version of this bug is the expensive one: an
      # unresolvable name would still yield a plausible constant key that silently stopped
      # tracking the model, so a real model swap would serve stale weights.
      - name: Resolve embedding model
        id: embed-model
        run: |
          name=$(sed -n 's/^_MODEL_NAME = "\(.*\)"$/\1/p' shared/parallax_embed/__init__.py)
          if [ -z "$name" ]; then
            echo "Could not read _MODEL_NAME from shared/parallax_embed/__init__.py" >&2
            exit 1
          fi
          echo "key=${name//\//-}" >> "$GITHUB_OUTPUT"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-${{ runner.os }}-${{ steps.embed-model.outputs.key }}

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e ./shared

      # conftest.py assumes the schema already exists — it opens a transaction and rolls it
      # back, it does not create tables.
      - name: Create schema
        run: python scripts/init_db.py
        working-directory: backend

      - name: Run tests
        run: python -m pytest -q
        working-directory: backend

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
        working-directory: extension

      - run: npm run typecheck
        working-directory: extension

      - run: npm test
        working-directory: extension

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # There are no frontend unit tests yet; NotesExport.tsx and notesPdf.tsx are covered only
      # by the compiler. `build` runs `tsc -b` and then Vite, so it catches bundling breakage too.
      - run: npm run build
        working-directory: frontend

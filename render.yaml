# One-click Render Blueprint: API container (uvicorn + Celery + 4 MCP servers via
# deploy/start.sh), managed Postgres (pgvector is on Render's allowed-extensions list;
# init_db runs CREATE EXTENSION on boot), and a Key Value (Redis) instance.
#
# After the blueprint deploys, point the Vercel frontend at it:
#   VITE_API_BASE_URL = https://<this-service>.onrender.com
#   VITE_WS_BASE_URL  = wss://<this-service>.onrender.com
services:
  - type: web
    name: parallax-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parallax-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: parallax-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # set in the dashboard when the blueprint prompts for it
      - key: CORS_ORIGINS
        value: "*" # tighten to the Vercel domain once you know it

  - type: keyvalue
    name: parallax-redis
    plan: free
    ipAllowList: [] # internal connections only

databases:
  - name: parallax-db
    plan: free

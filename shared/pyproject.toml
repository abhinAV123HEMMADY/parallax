[project]
name = "mentra-embed"
version = "0.1.0"
description = "Shared text embeddings for the Mentra backend and MCP servers"
requires-python = ">=3.11"
dependencies = ["fastembed>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mentra_embed"]

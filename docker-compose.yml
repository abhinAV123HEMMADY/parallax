services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: parallax-postgres
    environment:
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: parallax
      POSTGRES_DB: parallax
    ports:
      # Host port 5433, not 5432 — many dev machines already have a native Postgres on 5432,
      # which macOS will route "localhost" to instead of this container.
      - "5433:5432"
    volumes:
      - parallax_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: parallax-redis
    ports:
      # Host port 6380, not 6379 — same reasoning as the Postgres port above.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  parallax_pg_data:
